<svg viewBox="0 0 1200 332" width="1200" height="332" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="O que eu faço: sites e landing, e-commerce, bots e automação, sistemas sob medida, apps e PWA, integrações e API">
  <defs>
