    </g>
    <text x="28" y="104" font-family="ui-monospace,Menlo,monospace" font-size="19" font-weight="700" fill="#fff">Sites &amp; Landing</text>
    <text x="28" y="130" font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#9aa4b2">institucional · landing que converte</text>
