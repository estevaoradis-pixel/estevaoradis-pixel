    <g transform="translate(28,30)" fill="none" stroke="#FFC24B" stroke-width="2" stroke-linejoin="round">
      <path d="M0 2 h6 l5 22 h20 l5 -16 h-26"/><circle cx="14" cy="30" r="2.4" fill="#FFC24B"/><circle cx="30" cy="30" r="2.4" fill="#FFC24B"/>
    </g>
    <text x="28" y="104" font-family="ui-monospace,Menlo,monospace" font-size="19" font-weight="700" fill="#fff">E-commerce</text>
    <text x="28" y="130" font-family="ui-monospace,Menlo,monospace" font-size="13.5" fill="#9aa4b2">loja · checkout · painel</text>
  </g>
  <g transform="translate(800,10)">
    <rect width="360" height="150" rx="14" fill="url(#cardg)" stroke="#FFC24B" stroke-opacity="0.22"/>
    <rect x="14" width="332" height="1.5" fill="url(#topline)"/>
    <g transform="translate(28,28)" fill="none" stroke="#FFC24B" stroke-width="2">
