      <g stroke-linecap="round"><line x1="16" y1="-1" x2="16" y2="3"/><line x1="16" y1="25" x2="16" y2="29"/><line x1="1" y1="14" x2="5" y2="14"/><line x1="27" y1="14" x2="31" y2="14"/><line x1="5.5" y1="3.5" x2="8" y2="6"/><line x1="24" y1="22" x2="26.5" y2="24.5"/></g>
