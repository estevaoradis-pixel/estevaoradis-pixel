    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC24B" stop-opacity="0"/><stop offset="0.5" stop-color="#FFC24B" stop-opacity="0.7"/><stop offset="1" stop-color="#FFC24B" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="332" fill="#080a12"/>

  <!-- reusable: cada card é um grupo -->
  <!-- linha 1 -->
  <g transform="translate(40,10)">
