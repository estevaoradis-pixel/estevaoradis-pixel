name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12h, keeps the animation up to date
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]          # generate on the first push

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the SVGs (light and dark)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFC24B
            dist/snake.svg?color_snake=#E39B2E&color_dots=#ebedf0,#ffe0a3,#ffc24b,#e39b2e,#b9781f

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
